name: Planning documentation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_planning.py
      - run: python scripts/check_tracking.py
      - run: python scripts/check_design.py
      - run: python scripts/check_d1_inputs.py
      - run: python scripts/check_daily_inputs.py
      - run: python scripts/check_session_proxy.py
      - run: python scripts/check_relative_strength.py
      - run: python scripts/check_fundamental_vintages.py
      - run: python scripts/check_earnings_surprise.py
      - run: python scripts/check_rsi2.py
      - run: python scripts/check_opening_gap.py
      - run: python scripts/check_scheduled_event.py
      - run: python scripts/check_filing_purchase.py
      - run: python scripts/check_window_volume.py
      - run: python scripts/check_flag_endpoints.py
      - run: python scripts/check_source_admission.py
      - run: python scripts/check_availability_recorder.py
      - run: python scripts/check_reference_fixtures.py
      - run: python scripts/check_chronology.py
      - run: python scripts/check_m1.py
      - run: python scripts/check_m2.py
      - run: python scripts/check_m2_sleeves.py
      - run: python scripts/check_library_import.py
      - run: python scripts/check_library_v3_import.py
      - run: python scripts/check_library_v2_import.py
      - run: python scripts/check_sigmatiq_v1_import.py
      - name: Check frozen exploratory D1 mechanics
        run: python scripts/check_d1_exploratory.py
